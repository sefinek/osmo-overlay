name: Smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FFMPEG_BUILD: n9.0
  FFMPEG_BTBN_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

jobs:
  smoke:
    name: Start the app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ffmpeg-$env:FFMPEG_BUILD-latest-win64-gpl-shared-$($env:FFMPEG_BUILD.TrimStart('n'))"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "$env:FFMPEG_BTBN_URL/$name.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "$name\bin")

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="ffmpeg-$FFMPEG_BUILD-latest-linux64-gpl-shared-${FFMPEG_BUILD#n}"
          curl -fsSL --retry 3 "$FFMPEG_BTBN_URL/$name.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/$name/lib" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y xvfb libfontconfig1

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Build
        run: dotnet build OsmoOverlay.Gui -c Release

      - name: Start the app
        if: runner.os != 'Linux'
        run: dotnet run --project OsmoOverlay.Gui -c Release --no-build -- --smoke-test

      - name: Start the app (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet run --project OsmoOverlay.Gui -c Release --no-build -- --smoke-test
