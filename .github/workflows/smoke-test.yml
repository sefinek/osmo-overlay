name: Smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  smoke:
    name: Start the app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg

      - name: Build
        run: dotnet build OsmoOverlay.Gui -c Release

      - name: Start the app
        if: runner.os != 'Linux'
        run: dotnet run --project OsmoOverlay.Gui -c Release --no-build -- --smoke-test

      - name: Start the app (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet run --project OsmoOverlay.Gui -c Release --no-build -- --smoke-test
