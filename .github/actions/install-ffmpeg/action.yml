name: Install FFmpeg
description: FFmpeg with the shared libraries the app's preview loads, on the major FFmpeg.AutoGen targets

inputs:
  gyan-version:
    description: Gyan's release (Windows), the same build the app installs through winget
    default: 9.0.2
  gyan-sha256:
    description: SHA-256 of that release's full_build-shared.zip
    default: 8d31e162f1616e37aab3fa2db991b97e1b8dbeb1c8465fd81a81be16ff91b328
  btbn-build:
    description: BtbN release branch (Linux)
    default: n9.0

runs:
  using: composite
  steps:
    - name: Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ inputs.gyan-version }}
        SHA256: ${{ inputs.gyan-sha256 }}
      run: |
        $name = "ffmpeg-$env:VERSION-full_build-shared"
        $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
        Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:VERSION/$name.zip" -OutFile $zip
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SHA256) { throw 'FFmpeg download hash mismatch' }
        Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
        Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "$name\bin")

    - name: Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        BUILD: ${{ inputs.btbn-build }}
      run: |
        name="ffmpeg-$BUILD-latest-linux64-gpl-shared-${BUILD#n}"
        curl -fsSL --retry 3 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/$name/lib" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y xvfb libfontconfig1

    - name: macOS
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ffmpeg
